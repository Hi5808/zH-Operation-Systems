# ofono binder driver configuration for MTK devices (BL6000 Pro, MT6873).
# From the UBports Volla X23 (MTK) reference port. extPlugin=mtk adds MTK IMS (VoLTE).
[Settings]
ExpectSlots = slot1,slot2
3GLTEHandover = false
MaxNonDataMode = none

radioInterface = 1.4
# 5G (nr) selectable; AT&T reports dcnr_restricted=1, so LTE stays the default
technologies = gsm,umts,lte,nr
emptyPinQuery = false
useDataProfiles = true
mmsDataProfileId = 1001
# RIL_REQUEST_HANGUP_WAITING_OR_BACKGROUND
rilRequestOnSetUdub = 13
extPlugin = mtk
signalStrengthRange=-113,-51

[slot1]
path = /ril_0
slot = 0

[slot2]
path = /ril_1
slot = 1
