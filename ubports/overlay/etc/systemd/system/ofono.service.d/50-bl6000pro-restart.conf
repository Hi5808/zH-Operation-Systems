# BL6000 Pro: ofonod segfaults at boot while the MTK radio is still
# RADIO_NOT_AVAILABLE (seen 4-6x every boot). The stock policy (100 ms,
# 5 starts / 10 s) can exhaust in <1 s and leave the phone with no service.
# Retry every 3 s and allow plenty of attempts while the modem comes up.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=40

[Service]
RestartSec=3
