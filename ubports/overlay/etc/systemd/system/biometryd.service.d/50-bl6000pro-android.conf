[Service]
# BL6000 Pro: biometryd must not open the android fingerprint HAL until it is
# registered — opening it during the HAL's init races and aborts the HAL
# (SunwaveFingerprintService dtor SIGABRT -> crash loop). Wait for the HIDL
# service to appear, then a short settle, before starting.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 90); do lxc-attach -n android -- /system/bin/lshal 2>/dev/null | grep -q "biometrics.fingerprint@2.1::IBiometricsFingerprint/default" && { sleep 4; exit 0; }; sleep 1; done; exit 0'
ExecStart=
ExecStart=/usr/bin/biometryd run --config=/usr/lib/bl6000pro/halium/biometryd.json
