# BL6000 Pro: the system compositor needs the Android composer service.
# Wait for it (up to 60 s) and retry slowly instead of failing the seat.
[Unit]
StartLimitIntervalSec=120
StartLimitBurst=10

[Service]
ExecStartPre=/bin/sh -c 'i=0; until [ "$(getprop init.svc.vendor.hwcomposer-2-1)" = running ] || [ $i -ge 60 ]; do sleep 1; i=$((i+1)); done; sleep 2'
Restart=on-failure
RestartSec=3
