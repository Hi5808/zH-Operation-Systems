# BL6000 Pro: default to the primary output. droid-card's sink.fast is the
# Android low-latency path (10 ms buffer) and stutters with browser/media playback.
[Service]
ExecStartPost=/bin/sh -c 'for i in $(seq 20); do pactl list short sinks | grep -q sink.primary_output && break; sleep 0.5; done; pactl set-default-sink sink.primary_output; for s in $(pactl list short sink-inputs | cut -f1); do pactl move-sink-input $s sink.primary_output; done; true'
