# RG405M native Ubuntu Touch — extlinux config.
# Goes on the FAT boot partition (p2) alongside Image + ums512-rg405m.dtb.
# Boot chain: eMMC SPL -> U-Boot (SD uboot partition) -> extlinux -> this.
default rg405m
timeout 10
label rg405m
    kernel /Image
    fdt /ums512-rg405m.dtb
    append root=/dev/mmcblk0p3 rw rootwait console=tty0 fbcon=rotate:3 loglevel=7
