{{- $architecture := or .architecture "arm64" -}}
{{- $ubuntu_base_version := or .ubuntu_base_version "24.04.5" -}}
{{- $ut_aptly_archive := or .ut_aptly_archive "24.04-1.x" -}}
{{- $variant := or .variant "mainline" -}}

# Native Ubuntu Touch (Lomiri) rootfs for the Anbernic RG405M — FROM SCRATCH.
# No Halium / libhybris / Android container. Built like UBports' modern bases:
# Ubuntu Base + repo.ubports.com + the NATIVE "mainline" UT variant
# (ubuntu-touch-core-mainline / ubuntu-touch-mainline / session-wayland), on our
# mainline 7.2.9-sprd-ums512 kernel, GPU via Mesa Panfrost (gbm-kms).
#
# Build 24.04:  sudo debos rg405m.yaml
# Build 26.04:  sudo debos -t ubuntu_base_version:26.04 -t ut_aptly_archive:26.04-1.x rg405m.yaml
# (16.04 is a separate legacy path — system-image rootfs — not this recipe.)
#
# Kernel Image + dtb are NOT installed here; they go on the FAT boot partition at
# SD-assembly time (SPL -> U-Boot -> extlinux). Only the =m modules go in the rootfs.

architecture: {{ $architecture }}
actions:
  # 1) Ubuntu Base + UBports repo (from scratch; no debootstrap needed)
  - action: recipe
    description: Ubuntu Base + UBports repo ({{ $ubuntu_base_version }})
    recipe: ubuntu-touch/common-base.yaml
    variables:
      architecture: {{ $architecture }}
      ubuntu_base_version: {{ $ubuntu_base_version }}
      ut_aptly_archive: {{ $ut_aptly_archive }}
      # Skip the "_apt user removal" — it's a Halium/Android-kernel workaround we
      # don't need on a native kernel (and the upstream action is broken: it uses
      # `script: userdel _apt`, which debos treats as a missing script file).
      skip_remove_apt_user: "true"

  # 2) Install the NATIVE Ubuntu Touch session (variant=mainline => no Halium)
  - action: recipe
    description: Install Ubuntu Touch ({{ $variant }} / native)
    recipe: ubuntu-touch/ubuntu-touch-common.yaml
    variables:
      architecture: {{ $architecture }}
      variant: {{ $variant }}
      # Ensure Mesa + Panfrost userspace is present (GL + Vulkan). On 24.04 libglvnd
      # auto-selects the Mesa EGL vendor via egl_vendor.d — no alternatives needed,
      # so we do NOT run the legacy enable-mesa.sh (it breaks on glvnd layouts).
      additional_package: "libegl-mesa0 libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers"

  # 3) GPU: Mesa/Panfrost is installed above; libglvnd handles EGL vendor
  #    selection on 24.04 (no mesa-egl alternatives step).

  # 4) Our mainline 7.2.9 kernel MODULES (149 .ko). Image/dtb go on FAT at assembly.
  - action: overlay
    description: Install 7.2.9 kernel modules
    source: rg405m/modules
    destination: /
  - action: run
    chroot: true
    description: depmod our 7.2.9 kernel (explicit; auto-detect picks host uname)
    command: depmod 7.2.9-sprd-ums512

  # 5) RG405M device overlay (rotate-270 handled via extlinux cmdline; gamepad tuned on-device)
  - action: overlay
    description: RG405M device files
    source: rg405m/overlay
    destination: /

  # 6) Firmware (DEFERRED for first boot): sprd Wi-Fi/BT/GNSS once sprdwcn/VBC are
  #    built into the kernel (hashes/paths in the device proprietary-files.txt).

  # 7) Pack the native UT rootfs for SD assembly (p3 ext4)
  - action: pack
    description: Pack native UT rootfs
    file: rg405m-ut-{{ $ubuntu_base_version }}-rootfs.tar.gz
    compression: gz
